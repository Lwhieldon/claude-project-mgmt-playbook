<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Four building blocks of the playbook — CLAUDE.md, Slash Commands, Skills, and Sample Projects — feeding into Claude Code">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBFCFE"></stop>
      <stop offset="100%" stop-color="#F1F5F9"></stop>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"></stop>
      <stop offset="100%" stop-color="#0B1220"></stop>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#CBD5E1" opacity="0.5"></circle>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F172A"></path>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9488"></path>
    </marker>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" in="SourceAlpha"></feGaussianBlur>
      <feOffset dy="4"></feOffset>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"></feFuncA></feComponentTransfer>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#paper)"></rect>
  <rect width="1200" height="700" fill="url(#dots)"></rect>

  
  <g transform="translate(60,52)">
    <rect width="6" height="22" fill="#0D9488" rx="1"></rect>
    <text x="18" y="17" font-family="ui-monospace, &#39;JetBrains Mono&#39;, Menlo, monospace" font-size="13" letter-spacing="3" fill="#475569">ARCHITECTURE</text>
    <text x="0" y="58" font-family="Inter, &#39;Segoe UI&#39;, sans-serif" font-weight="700" font-size="32" fill="#0F172A" letter-spacing="-0.5">Four building blocks. One Claude Code.</text>
  </g>

  
  <g fill="none" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="5 5">
    
    <line x1="600" y1="282" x2="600" y2="320" marker-end="url(#arrowTeal)"></line>
    
    <line x1="338" y1="430" x2="490" y2="430" marker-end="url(#arrowTeal)"></line>
    
    <line x1="862" y1="430" x2="710" y2="430" marker-end="url(#arrowTeal)"></line>
    
    <line x1="600" y1="560" x2="600" y2="540" marker-end="url(#arrowTeal)"></line>
  </g>

  
  <g transform="translate(440,158)" filter="url(#cardShadow)">
    <rect width="320" height="124" rx="12" fill="#FFFFFF" stroke="#E2E8F0"></rect>
    <rect x="0" y="0" width="6" height="124" rx="6" fill="#0D9488"></rect>
    <g transform="translate(24,28)">
      <text font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#0D9488" letter-spacing="2">FILE</text>
      <text y="30" font-family="ui-monospace, &#39;JetBrains Mono&#39;, Menlo, monospace" font-weight="600" font-size="22" fill="#0F172A">CLAUDE.md</text>
      <text y="60" font-family="Inter, sans-serif" font-size="14" fill="#475569" font-weight="600">Engagement context</text>
      <text y="82" font-family="Inter, sans-serif" font-size="13" fill="#64748B">Loaded automatically before every conversation.</text>
    </g>
  </g>

  
  <g transform="translate(60,368)" filter="url(#cardShadow)">
    <rect width="278" height="124" rx="12" fill="#FFFFFF" stroke="#E2E8F0"></rect>
    <rect x="0" y="0" width="6" height="124" rx="6" fill="#2563EB"></rect>
    <g transform="translate(24,28)">
      <text font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#2563EB" letter-spacing="2">/COMMANDS</text>
      <text y="30" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#0F172A">Slash Commands</text>
      <text y="60" font-family="Inter, sans-serif" font-size="14" fill="#475569" font-weight="600">Shortcut prompts</text>
      <text y="82" font-family="Inter, sans-serif" font-size="13" fill="#64748B">Reusable, parameterised plays you call by name.</text>
    </g>
  </g>

  
  <g transform="translate(862,368)" filter="url(#cardShadow)">
    <rect width="278" height="124" rx="12" fill="#FFFFFF" stroke="#E2E8F0"></rect>
    <rect x="0" y="0" width="6" height="124" rx="6" fill="#7C3AED"></rect>
    <g transform="translate(24,28)">
      <text font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7C3AED" letter-spacing="2">SKILLS</text>
      <text y="30" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#0F172A">Skills</text>
      <text y="60" font-family="Inter, sans-serif" font-size="14" fill="#475569" font-weight="600">Auto-triggered behaviors</text>
      <text y="82" font-family="Inter, sans-serif" font-size="13" fill="#64748B">Senior delivery experience codified, applied on cue.</text>
    </g>
  </g>

  
  <g transform="translate(440,560)" filter="url(#cardShadow)">
    <rect width="320" height="96" rx="12" fill="#FFFFFF" stroke="#E2E8F0"></rect>
    <rect x="0" y="0" width="6" height="96" rx="6" fill="#0EA5E9"></rect>
    <g transform="translate(24,24)">
      <text font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#0EA5E9" letter-spacing="2">/SAMPLES</text>
      <text y="28" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#0F172A">Sample Projects</text>
      <text y="54" font-family="Inter, sans-serif" font-size="13" fill="#64748B">Practice data on a fake engagement.</text>
    </g>
  </g>

  
  <g transform="translate(490,320)" filter="url(#cardShadow)">
    <rect width="220" height="220" rx="18" fill="url(#hub)" stroke="#1E293B"></rect>
    
    <g stroke="#1E293B" stroke-width="0.6" opacity="0.6">
      <line x1="0" y1="56" x2="220" y2="56"></line>
      <line x1="0" y1="112" x2="220" y2="112"></line>
      <line x1="0" y1="168" x2="220" y2="168"></line>
    </g>
    
    <g transform="translate(0,30)">
      <text x="110" y="0" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#2DD4BF" letter-spacing="3">CORE</text>
      <text x="110" y="58" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="28" fill="#F8FAFC">Claude Code</text>
      
      <g transform="translate(38,80)" font-family="ui-monospace, Menlo, monospace" font-size="13">
        <rect width="144" height="76" rx="8" fill="#020617" stroke="#1E293B"></rect>
        <g transform="translate(10,10)">
          <circle cx="3" cy="3" r="3" fill="#F87171"></circle>
          <circle cx="13" cy="3" r="3" fill="#F59E0B"></circle>
          <circle cx="23" cy="3" r="3" fill="#34D399"></circle>
        </g>
        <text x="12" y="38" fill="#2DD4BF">&gt;</text>
        <text x="24" y="38" fill="#CBD5E1">/status-</text>
        <text x="24" y="56" fill="#CBD5E1">  report</text>
      </g>
    </g>
  </g>

  
  <g transform="translate(60,150)" filter="url(#cardShadow)">
    <rect width="230" height="96" rx="10" fill="#FFFFFF" stroke="#E2E8F0"></rect>
    <text x="20" y="26" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="2" fill="#94A3B8">KEY</text>
    <g transform="translate(20,42)">
      <line x1="0" y1="9" x2="40" y2="9" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrowTeal)"></line>
      <text x="58" y="13" font-family="Inter, sans-serif" font-size="13" fill="#0F172A" font-weight="600">feeds into</text>
    </g>
    <text x="20" y="82" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Each block plugs into Claude Code.</text>
  </g>
</svg>